name: Repository Context Drift
on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: node dist/cli.js drift-check
